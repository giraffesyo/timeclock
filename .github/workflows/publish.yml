name: Publish

# Publishes @giraffesyo/timeclock to npm when a tag npm-vX.Y.Z is pushed.
# It signs in with npm's trusted publishing (OIDC), so there is no token to
# keep: the package's settings on npmjs.com name this repository and this
# workflow as its publisher.
on:
  push:
    tags: ["npm-v*"]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - name: The tag is the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: test "npm-v$(node -p "require('./package.json').version")" = "$TAG"
        working-directory: web/packages/timeclock
      - run: pnpm build
        working-directory: web/packages/timeclock
      - run: npm publish
        working-directory: web/packages/timeclock
